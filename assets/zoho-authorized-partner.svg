<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Rounded Badge Card Background -->
  <rect x="1" y="1" width="278" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Zoho Standard 4-Color Blocks Logo -->
  <g transform="translate(14, 12)">
    <!-- Red Block (Z) -->
    <rect x="0" y="0" width="16" height="16" rx="3.5" fill="#E42528"/>
    <!-- Green Block (O) -->
    <rect x="19" y="0" width="16" height="16" rx="3.5" fill="#43A047"/>
    <!-- Blue Block (H) -->
    <rect x="0" y="19" width="16" height="16" rx="3.5" fill="#0083CB"/>
    <!-- Yellow Block (O) -->
    <rect x="19" y="19" width="16" height="16" rx="3.5" fill="#F4B400"/>
    
    <!-- Letter Inscriptions -->
    <text x="8" y="12" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Z</text>
    <text x="27" y="12" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">O</text>
    <text x="8" y="31" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">H</text>
    <text x="27" y="31" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">O</text>
  </g>

  <!-- Divider Line -->
  <line x1="62" y1="12" x2="62" y2="48" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Partner Text Hierarchy -->
  <g transform="translate(74, 14)">
    <text x="0" y="13" fill="#0F172A" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="0.06em">AUTHORISED</text>
    <text x="0" y="27" fill="#E42528" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="0.08em">PARTNER</text>
  </g>
  
  <!-- Subtle Verified Checkmark/Pill -->
  <circle cx="254" cy="30" r="11" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <path d="M250 30l3 3 5-6" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
