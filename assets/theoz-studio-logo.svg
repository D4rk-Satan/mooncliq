<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="300" height="210">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Emblem with Zig-zag / Pulse Monogram -->
  <g filter="url(#glow)">
    <circle cx="150" cy="72" r="50" fill="currentColor"/>
    <!-- The precise geometric cut / inverted pathway inside circle -->
    <polyline points="121,79 146,47 167,78 179,64" 
              fill="none" 
              stroke="#0f172a" 
              stroke-width="11" 
              stroke-linecap="square" 
              stroke-linejoin="miter" />
  </g>

  <!-- Horizontal divider lines and 'THE' -->
  <line x1="45" y1="140" x2="128" y2="140" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <text x="150" y="144" 
        font-family="'Inter', system-ui, -apple-system, sans-serif" 
        font-size="14" 
        font-weight="800" 
        letter-spacing="5" 
        fill="currentColor" 
        text-anchor="middle">THE</text>
  <line x1="172" y1="140" x2="255" y2="140" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- 'OZ STUDIOS' text in bold geometric capitals -->
  <text x="150" y="182" 
        font-family="'Outfit', system-ui, -apple-system, sans-serif" 
        font-size="30" 
        font-weight="900" 
        letter-spacing="6" 
        fill="currentColor" 
        text-anchor="middle">OZ STUDIOS</text>
</svg>